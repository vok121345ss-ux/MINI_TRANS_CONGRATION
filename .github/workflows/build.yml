
name: Build KING DATA CENTER PRO

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Check source archive
        run: |
          test -f KING_DATA_CENTER_PRO_SOURCE.zip

      - name: Extract project
        run: unzip -o KING_DATA_CENTER_PRO_SOURCE.zip

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build APK
        run: gradle -p KING_DATA_CENTER_PRO/android-companion assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KING-DATA-CENTER-PRO-APK
          path: KING_DATA_CENTER_PRO/android-companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
